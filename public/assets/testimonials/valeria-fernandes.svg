<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3ed"/>
      <stop offset="100%" stop-color="#f8decb"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b43b24"/>
      <stop offset="100%" stop-color="#8a2818"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#b43b24" stroke-width="2.5" stroke-opacity="0.3"/>
  
  <!-- Clinician / Therapist Motif (Identical to Dr. Yesol Kim) -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cross motif -->
    <path d="M60 28 V46 M51 37 H69" stroke="#b43b24" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Clinician Silhouette -->
    <circle cx="60" cy="54" r="16" fill="#b43b24" stroke="none"/>
    <path d="M34 94 C34 76 45 74 60 74 C75 74 86 76 86 94" fill="#b43b24" stroke="none"/>
  </g>
  
  <!-- Brazil Flag Badge for Valéria Fernandes (São Paulo, Brazil) -->
  <g transform="translate(76, 76)">
    <circle cx="16" cy="16" r="15" fill="#009b3a" stroke="#b43b24" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
    <polygon points="16,6 26,16 16,26 6,16" fill="#fedf01"/>
    <circle cx="16" cy="16" r="5.5" fill="#002776"/>
    <path d="M11 17 C13 15 19 15 21 17" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
