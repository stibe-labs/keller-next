  <path d="M 40 268 Q 65 258 90 268 T 140 268 T 190 268 T 240 268 T 290 268 T 340 268 T 390 268 T 440 268 T 490 268 T 540 268 T 590 268" 
        stroke="#087F7F" stroke-width="1.5" stroke-linecap="round" opacity="0.22"/>

  <!-- Sensory Handprint Doodle in Keller Coral (Tactile Inclusion) -->
  <g stroke="#F46255" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.28" fill="none">
    <path d="M 680 235 C 675 220 700 218 705 235 C 707 248 697 258 687 256 C 680 254 677 245 680 235 Z"/>
    <path d="M 677 224 C 670 216 667 220 673 228"/>
    <path d="M 682 216 C 680 205 687 205 689 216"/>
    <path d="M 692 214 C 692 202 699 202 700 214"/>
    <path d="M 701 216 C 703 206 709 208 708 218"/>
    <path d="M 707 226 C 713 222 717 226 711 232"/>
  </g>


  <!-- ==============================================================
       ZONE 3: EXTENDING TO AND AROUND THE IMAGES (Bento Cards & Photography)
       ============================================================== -->
  
  <!-- Left Side: Cascading Dotted Trail leading into Documentary Photography Card in Teal -->
  <path d="M 60 275 C 45 305 30 330 20 370 C 12 410 24 450 18 490" 
        stroke="#087F7F" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6" opacity="0.25"/>
  
