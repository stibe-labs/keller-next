      <path d="M 1135 132 L 1131 137 L 1139 137 Z" fill="#087F7F" opacity="0.3"/>
      <path d="M 1135 137 C 1148 160 1122 184 1138 210 C 1146 222 1136 240 1142 258" stroke-dasharray="4 4"/>
