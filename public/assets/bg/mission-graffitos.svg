        stroke="#F46255" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" opacity="0.25"/>

  <!-- Looping Proprioceptive Sweep around Bento Card 01 Header in Teal -->
  <path d="M 520 335 C 550 315 580 345 610 325 C 630 310 655 330 675 320" 
        stroke="#087F7F" stroke-width="1.6" stroke-linecap="round" opacity="0.26"/>

  <!-- Soft Coral & Teal Sparkles near Images & Bento Cards -->
  <g opacity="0.25">
    <circle cx="490" cy="318" r="2.4" fill="#F46255"/>
    <circle cx="735" cy="310" r="2.2" fill="#087F7F"/>
    <circle cx="810" cy="420" r="2.2" fill="#F46255"/>
    <circle cx="1010" cy="425" r="2.4" fill="#087F7F"/>
    <circle cx="28" cy="460" r="1.8" fill="#087F7F"/>
    <circle cx="1075" cy="510" r="2" fill="#F46255"/>
