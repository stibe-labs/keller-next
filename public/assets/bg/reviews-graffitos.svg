    <!-- Smile -->
    <path d="M 505 68 C 508 72 512 72 515 68" stroke="#087F7F" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M 510 79 L 510 115"/>
    <!-- Joyful arms raised high -->
    <path d="M 510 90 L 485 70"/>
    <path d="M 510 90 L 535 70"/>
    <!-- Jumping legs -->
    <path d="M 510 115 L 490 140"/>
    <path d="M 510 115 L 530 140"/>
    <!-- Joy sparkles around child -->
    <circle cx="475" cy="55" r="2.5" fill="#E9B949" stroke="none"/>
    <circle cx="545" cy="55" r="2.5" fill="#E9B949" stroke="none"/>
  </g>

  <!-- Right: Loving hug doodle & thumbs up celebration -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" opacity="0.42">
    <!-- Heart pulse flourish -->
    <path d="M 850 90 C 870 70 890 90 910 110 C 930 90 950 70 970 90 C 970 125 910 155 910 155 C 910 155 850 125 850 90 Z" 
