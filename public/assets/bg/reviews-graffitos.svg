    <path d="M 120 135 L 122 140 L 127 141.5 L 122 143 L 120 148 L 118 143 L 113 141.5 L 118 140 Z" fill="#E9B949" stroke="none"/>
    <path d="M 140 135 L 142 140 L 147 141.5 L 142 143 L 140 148 L 138 143 L 133 141.5 L 138 140 Z" fill="#E9B949" stroke="none"/>
    <path d="M 160 135 L 162 140 L 167 141.5 L 162 143 L 160 148 L 158 143 L 153 141.5 L 158 140 Z" fill="#E9B949" stroke="none"/>
  </g>

  <!-- Center: Happy Jumping / Dancing Child Doodle with arms raised -->
  <g stroke="#F46255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
