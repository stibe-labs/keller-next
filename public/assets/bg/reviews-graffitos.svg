<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%" fill="none">
  <!-- Left: Conversation speech bubble with heart & glowing 5-stars -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M 60 75 C 60 55 85 45 115 45 C 145 45 170 55 170 75 C 170 95 145 105 125 105 L 105 120 L 110 105 C 85 105 60 95 60 75 Z" 
          stroke-dasharray="10 4"/>
    <path d="M 115 65 C 110 58 98 62 104 72 C 110 82 115 88 115 90 C 115 88 120 82 126 72 C 132 62 120 58 115 65 Z" 
          fill="#F46255" stroke="none" opacity="0.7"/>
