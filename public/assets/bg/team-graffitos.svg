<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%" fill="none">
  <!-- Left: Industrial Designer Pencil & Fabric Shears Doodle -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Tailor shears / scissors -->
    <circle cx="65" cy="130" r="12" stroke="#F46255"/>
    <circle cx="85" cy="130" r="12" stroke="#F46255"/>
    <path d="M 70 120 L 95 65"/>
    <path d="M 80 120 L 55 65"/>
    <!-- Pencil sketching arc -->
    <path d="M 140 70 L 165 45 L 175 55 L 150 80 Z"/>
    <path d="M 140 70 L 132 78 L 150 80 Z" fill="#E9B949" stroke="none"/>
    <path d="M 132 78 C 120 95 130 115 155 110 C 180 105 195 125 180 145" stroke="#F46255" stroke-dasharray="5 4"/>
  </g>

  <!-- Center: Collaborative Maker Team Smiles (3 united faces) -->
  <g stroke="#F46255" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
    <!-- Center Person -->
    <circle cx="530" cy="75" r="16" stroke="#087F7F"/>
    <path d="M 524 78 C 527 82 533 82 536 78"/>
    <path d="M 515 95 C 510 115 510 145 510 155 L 550 155 C 550 145 550 115 545 95" stroke-dasharray="6 4"/>
    <!-- Left Teammate -->
    <circle cx="490" cy="85" r="13"/>
    <path d="M 485 88 C 488 91 492 91 495 88"/>
    <path d="M 478 102 C 475 118 475 140 475 155 L 505 155" stroke-dasharray="6 4" stroke="#087F7F"/>
    <!-- Right Teammate -->
    <circle cx="570" cy="85" r="13" stroke="#E9B949"/>
    <path d="M 565 88 C 568 91 572 91 575 88"/>
    <path d="M 555 102 C 558 118 558 140 585 155" stroke-dasharray="6 4" stroke="#087F7F"/>
  </g>

  <!-- Right: Craft Lightbulb / Spark of Innovation -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
    <path d="M 870 90 C 855 75 855 50 875 40 C 895 30 915 50 900 75 C 895 85 890 95 890 105 L 880 105 C 880 95 875 85 870 90 Z" 
          stroke="#E9B949" stroke-dasharray="8 4"/>
    <path d="M 880 105 C 880 112 890 112 890 105"/>
    <!-- Radiating inspiration rays -->
    <path d="M 855 45 L 845 35" stroke="#F46255"/>
    <path d="M 885 30 L 885 20" stroke="#F46255"/>
    <path d="M 915 45 L 925 35" stroke="#F46255"/>
    <circle cx="950" cy="85" r="2.5" fill="#E9B949" stroke="none"/>
  </g>
</svg>
