<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <!-- Keller Adapt Calling & Communication Vector Artwork -->
  <defs>
    <linearGradient id="callGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E24B32" />
      <stop offset="100%" stop-color="#F46255" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F7F" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Left: Classic Telephone Receiver with Audio Ripple Radiations -->
  <g transform="translate(60, 40)">
    <!-- Expanding Sound Wave Rings -->
    <circle cx="60" cy="60" r="45" stroke="#E24B32" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.35" />
    <circle cx="60" cy="60" r="65" stroke="#087F7F" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25" />
    <circle cx="60" cy="60" r="85" stroke="#E9B949" stroke-width="1.5" opacity="0.2" />

    <!-- Telephone Handset Badge -->
    <rect x="24" y="24" width="72" height="72" rx="20" fill="#FFF2EE" stroke="#E24B32" stroke-width="2" />
    <path d="M48 46 C46 46 43 48 43 51 C43 64 54 75 67 75 C70 75 72 72 72 70 L72 65 C72 63 70 61 68 61 L63 60 C61 59 59 60 58 62 L56 64 C52 62 48 58 46 54 L48 52 C50 51 51 49 50 47 L49 42 C49 40 47 38 45 38 L40 38 Z" fill="url(#callGrad)" />

    <!-- Audio Beams -->
    <path d="M80 42 C85 47 85 57 80 62" stroke="#E24B32" stroke-width="2.5" stroke-linecap="round" />
    <path d="M86 36 C94 44 94 62 86 70" stroke="#087F7F" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Center: Connected Pulse Wave with Speech Bubbles -->
  <g transform="translate(260, 50)">
    <!-- Wavy Connecting Line (Voice Carrier) -->
    <path d="M0 60 Q40 20 80 60 T160 60 T240 60" stroke="#087F7F" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    
    <!-- Pulse Beats -->
    <path d="M120 60 L130 60 L136 40 L144 80 L152 48 L158 66 L164 60 L180 60" stroke="#E24B32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floating Chat Bubble -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="80" height="42" rx="12" fill="#E8F5F5" stroke="#087F7F" stroke-width="1.8" />
      <polygon points="20,42 26,52 36,42" fill="#E8F5F5" stroke="#087F7F" stroke-width="1.8" />
      <line x1="20" y1="41" x2="36" y2="41" stroke="#E8F5F5" stroke-width="2.5" />
      <!-- Dots -->
      <circle cx="24" cy="21" r="3" fill="#087F7F" />
      <circle cx="40" cy="21" r="3" fill="#087F7F" />
      <circle cx="56" cy="21" r="3" fill="#087F7F" />
    </g>

    <!-- Warm Star Sparkle -->
    <path d="M220 20 L223 29 L232 32 L223 35 L220 44 L217 35 L208 32 L217 29 Z" fill="#E9B949" />
  </g>

  <!-- Right: Smartphone / WhatsApp Direct Messenger -->
  <g transform="translate(600, 35)">
    <rect x="20" y="10" width="80" height="130" rx="16" fill="#F4FBF7" stroke="#10B981" stroke-width="2" />
    <rect x="44" y="18" width="32" height="4" rx="2" fill="#D1D5DB" />
    
    <!-- Screen Message bubbles -->
    <rect x="32" y="36" width="56" height="24" rx="8" fill="#10B981" />
    <path d="M38 48 L46 48 M38 52 L56 52" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <rect x="32" y="70" width="48" height="24" rx="8" fill="#E5E7EB" />
    <path d="M38 82 L50 82 M38 86 L58 86" stroke="#4B5563" stroke-width="2" stroke-linecap="round" />

    <!-- Signal rings -->
    <path d="M106 40 C114 48 114 62 106 70" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="122" r="5" fill="#D1D5DB" />
  </g>
</svg>
