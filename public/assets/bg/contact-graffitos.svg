<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <!-- ==============================================================
       CONTACT & CONNECT VECTOR GRAFFITOS (KELLER STYLE)
       Theme: Phone calls, speech bubbles, connecting waves, letter delivery, location pin
       Colors: Keller Coral (#F46255), Keller Teal (#087F7F), Warm Gold (#E9B949)
       ============================================================== -->

  <!-- ==============================================================
       ZONE 1: LEFT - Vintage Telephone Receiver & Ringing Sound Waves
       ============================================================== -->
  <g stroke="#F46255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Classic telephone handset -->
    <path d="M 65 95 C 60 70 85 45 110 50 C 122 53 130 65 125 78 L 115 90 C 112 94 106 95 102 91 L 92 82 C 86 88 88 102 98 112 C 108 122 122 124 128 118 L 137 108 C 141 104 148 105 151 110 L 163 125 C 172 135 168 152 150 155 C 125 160 80 135 65 95 Z" stroke="#F46255" fill="none" stroke-width="2.2"/>
    
    <!-- Ringing sound waves from receiver -->
    <path d="M 125 40 C 140 45 155 60 160 75" stroke="#087F7F" stroke-width="1.8" stroke-dasharray="3 3"/>
    <path d="M 138 28 C 160 35 180 55 188 78" stroke="#E9B949" stroke-width="1.8"/>
    <path d="M 152 18 C 180 28 205 52 215 80" stroke="#087F7F" stroke-width="1.8" stroke-dasharray="4 4"/>

    <!-- Curly spiral phone cord dangling down -->
    <path d="M 85 145 C 80 165 95 175 88 190 C 80 205 95 215 88 230 C 80 245 95 255 88 270 C 82 282 92 292 86 305" stroke="#F46255" stroke-width="2" fill="none"/>

    <!-- Cheerful speech chat bubble -->
    <g transform="translate(140, 140)">
      <path d="M 10 20 C 10 10 20 0 45 0 C 70 0 85 10 85 22 C 85 34 70 44 48 44 L 28 54 L 32 44 C 18 42 10 32 10 20 Z" stroke="#087F7F" stroke-width="1.8" fill="none"/>
      <!-- Smiling dots inside bubble -->
      <circle cx="36" cy="22" r="2.5" fill="#087F7F" stroke="none"/>
      <circle cx="48" cy="22" r="2.5" fill="#087F7F" stroke="none"/>
      <circle cx="60" cy="22" r="2.5" fill="#087F7F" stroke="none"/>
    </g>

    <!-- Sparkle star -->
    <path d="M 50 48 L 52 54 L 58 56 L 52 58 L 50 64 L 48 58 L 42 56 L 48 54 Z" fill="#E9B949" stroke="none"/>
  </g>

  <!-- ==============================================================
       ZONE 2: CENTER - Connected Dialogue, Waves & Location Beacon
       ============================================================== -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.40">
    <!-- Smartphone handset with audio waves -->
    <g transform="translate(480, 40)">
      <rect x="0" y="0" width="46" height="78" rx="8" stroke="#087F7F" stroke-width="2" fill="none"/>
      <line x1="16" y1="8" x2="30" y2="8" stroke="#087F7F" stroke-width="1.5"/>
      <!-- Screen heart / smiley -->
      <circle cx="23" cy="38" r="14" stroke="#F46255" stroke-dasharray="3 3"/>
      <path d="M 18 36 C 20 34 22 34 23 36 C 24 34 26 34 28 36 C 29 39 26 43 23 45 C 20 43 17 39 18 36 Z" fill="#F46255" stroke="none"/>
      <!-- Bottom home indicator bar -->
      <line x1="18" y1="70" x2="28" y2="70" stroke="#087F7F" stroke-width="1.5"/>

      <!-- Calling sound wave ripples -->
      <path d="M 54 25 C 62 32 62 48 54 55" stroke="#F46255" stroke-width="1.8"/>
      <path d="M 62 18 C 74 28 74 54 62 64" stroke="#E9B949" stroke-width="1.8" stroke-dasharray="3 3"/>
    </g>

    <!-- Heartbeat signal connecting across -->
    <path d="M 570 78 L 610 78 L 618 62 L 626 94 L 634 70 L 642 82 L 650 78 L 710 78" stroke="#F46255" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cheerful second dialogue bubble on the right of heartbeat -->
    <g transform="translate(680, 30)">
      <path d="M 10 24 C 10 12 22 2 46 2 C 70 2 82 12 82 24 C 82 36 68 46 48 46 L 25 56 L 28 46 C 16 44 10 35 10 24 Z" stroke="#F46255" stroke-width="1.8" fill="none"/>
      <!-- Heart icon inside -->
      <path d="M 40 22 C 41 20 44 20 46 22 C 48 20 51 20 52 22 C 53 25 49 28 46 30 C 43 28 39 25 40 22 Z" fill="#F46255" stroke="none"/>
    </g>

    <!-- Little antenna / transmission beacon -->
    <path d="M 440 85 L 440 55" stroke="#E9B949" stroke-width="2"/>
    <circle cx="440" cy="50" r="4" fill="#E9B949" stroke="none"/>
    <path d="M 430 45 C 435 40 445 40 450 45" stroke="#E9B949" stroke-width="1.5"/>
    <path d="M 424 38 C 434 30 446 30 456 38" stroke="#E9B949" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- ==============================================================
       ZONE 3: RIGHT - Paper Plane Message, Kochi Pin & Welcoming Hands
       ============================================================== -->
  <g stroke="#F46255" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Paper airplane soaring with flight loop -->
    <g transform="translate(860, 45)">
      <path d="M 0 35 L 55 10 L 30 52 L 25 35 Z" stroke="#F46255" stroke-width="2" fill="none"/>
      <path d="M 25 35 L 55 10"/>
      <!-- Flight trail loop -->
      <path d="M -80 75 C -40 70 -20 20 -45 15 C -65 10 -70 45 -40 50 C -10 55 10 40 0 35" stroke="#087F7F" stroke-dasharray="4 4" fill="none"/>
    </g>

    <!-- Location Pin with concentric radar circles -->
    <g transform="translate(1010, 50)">
      <!-- Radar circles -->
      <circle cx="20" cy="22" r="28" stroke="#E9B949" stroke-width="1.5" stroke-dasharray="3 4"/>
      <circle cx="20" cy="22" r="18" stroke="#087F7F" stroke-width="1.5"/>
      <!-- Teardrop Map Pin -->
      <path d="M 20 6 C 11 6 4 13 4 22 C 4 33 20 50 20 50 C 20 50 36 33 36 22 C 36 13 29 6 20 6 Z" stroke="#F46255" stroke-width="2.2" fill="none"/>
      <!-- Inner dot -->
      <circle cx="20" cy="21" r="5" fill="#F46255" stroke="none"/>
    </g>

    <!-- Friendly envelope note with heart seal -->
    <g transform="translate(980, 125)">
      <rect x="0" y="0" width="46" height="32" rx="6" stroke="#087F7F" stroke-width="1.8" fill="none"/>
      <path d="M 0 0 L 23 18 L 46 0" stroke="#087F7F" stroke-width="1.8"/>
      <circle cx="23" cy="18" r="3" fill="#F46255" stroke="none"/>
    </g>

    <!-- Sparkles and stars -->
    <path d="M 940 30 L 942 35 L 947 37 L 942 39 L 940 44 L 938 39 L 933 37 L 938 35 Z" fill="#E9B949" stroke="none"/>
    <circle cx="1080" cy="90" r="3" fill="#087F7F" stroke="none"/>
    <circle cx="890" cy="130" r="2" fill="#F46255" stroke="none"/>
  </g>
</svg>
