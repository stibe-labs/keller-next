<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%" fill="none">
  <!-- Left: Clinical stethoscope curving into heart -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <!-- Earpieces -->
    <path d="M 65 55 C 75 75 80 95 80 110"/>
    <path d="M 95 55 C 85 75 80 95 80 110"/>
    <!-- Tube curving into heart -->
    <path d="M 80 110 C 80 135 110 155 125 130 C 140 105 110 85 95 105" stroke="#F46255" stroke-width="2"/>
    <circle cx="130" cy="155" r="9" stroke-width="2"/>
    <circle cx="130" cy="155" r="3.5" fill="#E9B949" stroke="none"/>
  </g>

  <!-- Center: Compassionate healing hands & neural synapses -->
  <g stroke="#F46255" stroke-width="1.7" stroke-linecap="round" opacity="0.42">
    <!-- Two gentle hands meeting in trust -->
    <path d="M 480 115 C 490 100 505 100 515 112 C 525 100 538 100 545 112 C 555 125 540 145 520 155 C 500 145 470 135 480 115 Z" 
          stroke-dasharray="10 4"/>
    <!-- Neural synaptic tree branch (sensory processing calibration) -->
    <path d="M 580 140 C 590 115 605 95 620 75" stroke="#087F7F" stroke-width="2"/>
    <path d="M 605 105 C 615 95 630 100 640 90" stroke="#087F7F" stroke-dasharray="4 3"/>
    <path d="M 595 125 C 608 122 622 130 635 125" stroke="#087F7F" stroke-dasharray="4 3"/>
    <circle cx="620" cy="75" r="4" fill="#E9B949" stroke="none"/>
    <circle cx="640" cy="90" r="3" fill="#F46255" stroke="none"/>
    <circle cx="635" cy="125" r="3" fill="#087F7F" stroke="none"/>
  </g>

  <!-- Right: Doctor clipboard with smiling checkmark & comforting hug loop -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
    <rect x="850" y="70" width="45" height="60" rx="8" stroke-dasharray="8 5"/>
    <rect x="862" y="62" width="20" height="12" rx="4" stroke="#F46255"/>
    <path d="M 862 100 L 870 108 L 882 92" stroke="#2DD4BF" stroke-width="2.2"/>
    <!-- Joyful sparkle -->
    <path d="M 940 70 L 942 75 L 947 76.5 L 942 78 L 940 83 L 938 78 L 933 76.5 L 938 75 Z" fill="#F46255" stroke="none"/>
    <circle cx="980" cy="95" r="2.5" fill="#E9B949" stroke="none"/>
    <circle cx="920" cy="115" r="2" fill="#087F7F" stroke="none"/>
  </g>
</svg>
