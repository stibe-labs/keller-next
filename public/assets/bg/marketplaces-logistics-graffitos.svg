<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" fill="none">
  <!-- ==============================================================
       WORLDWIDE EXPRESS TRANSPORT & GLOBAL LOGISTICS VECTOR GRAFFITOS
       Theme: Flight soaring, cargo delivery van picking up from Kochi,
              packages & routing to USA, EU, Australia
       Colors: Keller Coral (#F46255), Keller Teal (#087F7F), Warm Gold (#E9B949)
       ============================================================== -->

  <!-- ==============================================================
       1. GLOBAL FLIGHT ROUTING ARCS & CONTRAIL (Continuous loop across top)
       ============================================================== -->
  <g stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" opacity="0.45">
    <!-- Main looping flight trajectory path from Kochi up into the sky -->
    <path
      d="M 120 280 C 180 230, 240 140, 360 110 C 480 80, 620 90, 720 50 C 760 35, 820 40, 850 70 C 880 100, 860 160, 800 170 C 740 180, 710 140, 730 110 C 750 80, 800 60, 920 45"
      stroke="#F46255"
      stroke-width="2.2"
      stroke-dasharray="6 6"
      fill="none"
    />

    <!-- Parallel altitude guide line -->
    <path
      d="M 160 290 C 220 240, 280 160, 390 130 C 500 100, 630 110, 730 70"
      stroke="#E9B949"
      stroke-width="1.4"
      stroke-dasharray="3 5"
      fill="none"
    />
  </g>

  <!-- ==============================================================
       2. CARGO EXPRESS AIRPLANE SOARING ACROSS (Upper Center / Right)
       ============================================================== -->
  <g transform="translate(680, 30) rotate(-12)" stroke="#F46255" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- Fuselage (Main Body) -->
    <path
      d="M 20 45 C 50 40, 140 40, 180 48 C 205 53, 215 62, 210 68 C 200 75, 180 75, 140 75 C 90 75, 50 75, 20 65 C 10 62, 5 52, 20 45 Z"
      fill="#FFFFFF"
      stroke="#F46255"
      stroke-width="2.2"
    />

    <!-- Cockpit Windshield -->
    <path d="M 185 49 C 195 52, 200 58, 195 62 L 180 62 Z" fill="#087F7F" stroke="#087F7F" stroke-width="1.5"/>

    <!-- Cabin / Cargo Windows -->
    <circle cx="160" cy="56" r="2.5" fill="#087F7F" stroke="none"/>
    <circle cx="145" cy="56" r="2.5" fill="#087F7F" stroke="none"/>
    <circle cx="130" cy="56" r="2.5" fill="#087F7F" stroke="none"/>
    <circle cx="115" cy="56" r="2.5" fill="#087F7F" stroke="none"/>
    <circle cx="100" cy="56" r="2.5" fill="#087F7F" stroke="none"/>

    <!-- Main Wing (Swept Back) -->
    <path d="M 95 60 L 60 110 C 55 118, 65 120, 75 115 L 135 68 Z" fill="#FFF0ED" stroke="#F46255" stroke-width="2"/>

    <!-- Jet Engine Under Wing -->
    <rect x="80" y="85" width="28" height="12" rx="5" fill="#087F7F" stroke="#087F7F" stroke-width="1.5"/>
    <!-- Engine Thrust Puffs -->
    <path d="M 75 91 C 65 91, 60 88, 52 91" stroke="#E9B949" stroke-width="1.8" stroke-dasharray="2 3"/>

    <!-- Upper Wing (Far side perspective) -->
    <path d="M 110 42 L 95 10 C 92 5, 102 4, 108 8 L 135 42 Z" fill="#FFF0ED" stroke="#F46255" stroke-width="1.8"/>

    <!-- Tail Fin (Vertical Stabilizer) -->
    <path d="M 22 47 L 5 15 C 2 10, 10 8, 18 12 L 48 45 Z" fill="#FFF0ED" stroke="#F46255" stroke-width="2"/>
    <!-- Tail Horizontal Stabilizer -->
    <path d="M 15 62 L 0 72 C -3 75, 2 78, 8 76 L 30 65 Z" fill="#FFF0ED" stroke="#F46255" stroke-width="1.6"/>

    <!-- Speed & Wind Streamlines -->
    <path d="M 215 58 L 245 58" stroke="#E9B949" stroke-width="2"/>
    <path d="M 210 50 C 225 45, 240 45, 255 48" stroke="#087F7F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 205 68 C 220 72, 235 72, 250 70" stroke="#087F7F" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- ==============================================================
       3. GLOBAL DESTINATION HUBS (USA, EUROPE, AUSTRALIA BEACONS)
       ============================================================== -->
  <!-- USA Hub Beacon (Top Right) -->
  <g transform="translate(890, 85)" opacity="0.8">
    <circle cx="20" cy="20" r="18" stroke="#087F7F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="20" cy="20" r="6" fill="#F46255"/>
    <text x="20" y="48" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#1c1410" letter-spacing="0.05em">USA · 9 DAYS</text>
  </g>

  <!-- Europe Hub Beacon -->
  <g transform="translate(560, 60)" opacity="0.8">
    <circle cx="16" cy="16" r="14" stroke="#E9B949" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="16" cy="16" r="5" fill="#087F7F"/>
    <text x="16" y="42" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#1c1410" letter-spacing="0.05em">EU · DIRECT</text>
  </g>

  <!-- Australia Hub Beacon -->
  <g transform="translate(820, 190)" opacity="0.8">
    <circle cx="16" cy="16" r="14" stroke="#F46255" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="16" cy="16" r="5" fill="#E9B949"/>
    <text x="16" y="42" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#1c1410" letter-spacing="0.05em">AUSTRALIA</text>
  </g>

  <!-- Mini Earth Globe with Latitude Lines -->
  <g transform="translate(420, 140)" stroke="#087F7F" stroke-width="1.5" opacity="0.4">
    <circle cx="35" cy="35" r="30" fill="none"/>
    <ellipse cx="35" cy="35" rx="30" ry="12" fill="none"/>
    <ellipse cx="35" cy="35" rx="14" ry="30" fill="none"/>
    <line x1="5" y1="35" x2="65" y2="35"/>
    <circle cx="48" cy="28" r="3" fill="#F46255" stroke="none"/> <!-- Kochi dot on globe -->
  </g>

  <!-- ==============================================================
       4. KOCHI WORKSHOP & PICKUP LOCATION (Bottom Left)
       ============================================================== -->
  <g transform="translate(30, 200)" stroke="#087F7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Workshop Facility Building -->
    <g transform="translate(0, 40)">
      <!-- Building Gable Roof -->
      <path d="M 10 45 L 50 15 L 90 45 L 90 95 L 10 95 Z" fill="#FFFFFF" stroke="#087F7F" stroke-width="2"/>
      <path d="M 50 15 L 120 15 L 150 45 L 90 45" fill="#FFF9F7" stroke="#087F7F" stroke-width="1.8"/>
      <path d="M 150 45 L 150 95 L 90 95" fill="#FFF9F7" stroke="#087F7F" stroke-width="1.8"/>

      <!-- Chimney / Exhaust -->
      <rect x="25" y="12" width="10" height="16" fill="#F46255" stroke="#F46255"/>

      <!-- Roof Flag: KOCHI -->
      <line x1="50" y1="15" x2="50" y2="-5" stroke="#F46255" stroke-width="2"/>
      <path d="M 50 -5 L 75 2 L 50 9 Z" fill="#F46255" stroke="#F46255"/>

      <!-- Workshop Windows & Roll-Up Bay Door -->
      <rect x="25" y="55" width="20" height="18" rx="3" fill="#FAF7F2" stroke="#087F7F" stroke-width="1.5"/>
      <line x1="35" y1="55" x2="35" y2="73" stroke="#087F7F"/>
      <line x1="25" y1="64" x2="45" y2="64" stroke="#087F7F"/>

      <!-- Roll-up Cargo Bay Door (Open) -->
      <rect x="100" y="52" width="38" height="43" fill="#FAF7F2" stroke="#F46255" stroke-width="1.8"/>
      <line x1="100" y1="60" x2="138" y2="60" stroke="#F46255" stroke-width="1.2"/>
      <line x1="100" y1="68" x2="138" y2="68" stroke="#F46255" stroke-width="1.2"/>
      <line x1="100" y1="76" x2="138" y2="76" stroke="#F46255" stroke-width="1.2"/>
      <line x1="100" y1="84" x2="138" y2="84" stroke="#F46255" stroke-width="1.2"/>

      <!-- Signboard: KOCHI WORKSHOP -->
      <rect x="15" y="32" width="70" height="12" rx="3" fill="#FFF0ED" stroke="#F46255" stroke-width="1.4"/>
      <text x="50" y="41" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#F46255" stroke="none" letter-spacing="0.06em">KOCHI HUB</text>
    </g>

    <!-- Cargo Parcels & Crates Stacked at Bay -->
    <g transform="translate(145, 95)">
      <!-- Large Crate -->
      <rect x="0" y="15" width="28" height="25" rx="3" fill="#FFF5F2" stroke="#E9B949" stroke-width="1.8"/>
      <line x1="0" y1="15" x2="28" y2="40" stroke="#E9B949" stroke-width="1.2"/>
      <!-- Small Top Box -->
      <rect x="4" y="0" width="20" height="15" rx="2" fill="#FFFFFF" stroke="#087F7F" stroke-width="1.5"/>
      <line x1="14" y1="0" x2="14" y2="15" stroke="#F46255" stroke-width="1.5"/>
      <!-- Fragile Glass / Arrow Stamp -->
      <path d="M 11 6 L 14 3 L 17 6 M 14 3 L 14 11" stroke="#F46255" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ==============================================================
       5. EXPRESS DELIVERY VAN / TRANSPORT VEHICLE (Picking up from Workshop)
       ============================================================== -->
  <g transform="translate(210, 240)" stroke="#1c1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Ground / Road Shadows -->
    <ellipse cx="85" cy="88" rx="80" ry="5" fill="#1c1410" opacity="0.08" stroke="none"/>

    <!-- Van Main Body (Chassis) -->
    <path
      d="M 10 75 L 10 25 C 10 18, 16 12, 24 12 L 105 12 L 135 32 L 155 38 C 160 40, 164 45, 164 52 L 164 75 Z"
      fill="#FFFFFF"
      stroke="#1c1410"
      stroke-width="2.2"
    />

    <!-- Van Driver Cab Windshield -->
    <path d="M 108 18 L 132 35 L 150 40 L 150 52 L 108 52 Z" fill="#FFF0ED" stroke="#087F7F" stroke-width="1.8"/>

    <!-- Front Bumper & Headlight -->
    <rect x="158" y="60" width="8" height="14" rx="2" fill="#E9B949" stroke="#1c1410" stroke-width="1.6"/>
    <!-- Headlight Beam Beams -->
    <line x1="168" y1="64" x2="185" y2="60" stroke="#E9B949" stroke-width="1.8" stroke-dasharray="3 3"/>
    <line x1="168" y1="70" x2="188" y2="70" stroke="#E9B949" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Wheels (Front & Rear) -->
    <!-- Rear Wheel -->
    <g transform="translate(35, 75)">
      <circle cx="0" cy="0" r="14" fill="#1c1410" stroke="#1c1410" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#FAF7F2" stroke="#087F7F" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#E9B949" stroke="none"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(130, 75)">
      <circle cx="0" cy="0" r="14" fill="#1c1410" stroke="#1c1410" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#FAF7F2" stroke="#087F7F" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#E9B949" stroke="none"/>
    </g>

    <!-- Side Panel Decal: KELLER ADAPT EXPRESS -->
    <rect x="22" y="22" width="74" height="24" rx="4" fill="#FFF0ED" stroke="#F46255" stroke-width="1.4"/>
    <text x="59" y="34" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="800" fill="#F46255" stroke="none" letter-spacing="0.08em">KELLER ADAPT</text>
    <text x="59" y="42" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="#087F7F" stroke="none" letter-spacing="0.05em">GLOBAL EXPRESS</text>

    <!-- Motion / Speed lines behind van -->
    <line x1="-15" y1="35" x2="2" y2="35" stroke="#F46255" stroke-width="2" stroke-linecap="round"/>
    <line x1="-25" y1="48" x2="-4" y2="48" stroke="#087F7F" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="62" x2="4" y2="62" stroke="#E9B949" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ==============================================================
       6. SPARKLES & SENSORY CALIBRATION DOTS
       ============================================================== -->
  <g fill="#E9B949" stroke="none" opacity="0.6">
    <path d="M 520 22 L 522 28 L 528 30 L 522 32 L 520 38 L 518 32 L 512 30 L 518 28 Z"/>
    <path d="M 820 120 L 821.5 125 L 826.5 126.5 L 821.5 128 L 820 133 L 818.5 128 L 813.5 126.5 L 818.5 125 Z"/>
    <circle cx="370" cy="65" r="3"/>
    <circle cx="650" cy="180" r="2.5" fill="#F46255"/>
    <circle cx="950" cy="160" r="3" fill="#087F7F"/>
  </g>
</svg>
